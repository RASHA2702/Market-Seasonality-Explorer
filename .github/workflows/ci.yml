name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FiatCryptoGateway.sln
      # Warnings are errors (Directory.Build.props), so analyzer findings fail the build.
      - run: dotnet build FiatCryptoGateway.sln --no-restore --configuration Release
      - run: dotnet test FiatCryptoGateway.sln --no-build --configuration Release

  database:
    name: Migrations and constraint tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: gateway
          POSTGRES_USER: gateway_ci
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_ci -d gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: gateway
      PGUSER: gateway_ci
      PGPASSWORD: ci-only-throwaway
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations
        run: ./db/migrate.sh
      - name: Re-running migrations is a no-op
        run: |
          ./db/migrate.sh | tee migrate.log
          grep -q "Migrations applied: 0" migrate.log
      - name: Constraint tests
        run: |
          for test in db/tests/*.sql; do
            psql --no-psqlrc --quiet --set ON_ERROR_STOP=1 --file "$test"
          done

  container:
    name: Container image and HTTPS proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway settings and keys for this run
        run: |
          umask 077
          merchant_key="$(openssl rand -hex 32)"
          echo "$merchant_key" > ci-merchant-key
          printf 'POSTGRES_DB=gateway\nPOSTGRES_USER=gateway_app\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          {
            echo "Gateway__ApiKeys__Clients__0__ClientId=ci-merchant"
            echo "Gateway__ApiKeys__Clients__0__KeySha256=$(printf '%s' "$merchant_key" | sha256sum | cut -d' ' -f1)"
            echo "Gateway__Checkout__LinkSecret=$(openssl rand -hex 32)"
            echo "Gateway__Settlement__CoolingOffHours=0"
          } > gateway.env
          # A throwaway backup key, and a local folder standing in for off-site storage.
          docker compose --profile gateway build backup
          docker compose --profile gateway run --rm --no-deps -T backup age-keygen > backup-key.txt
          echo "BACKUP_AGE_RECIPIENTS=$(sed -n 's/^# public key: //p' backup-key.txt)" >> .env
          echo "BACKUP_COPY_TO=offsite:/backups/offsite-copy" >> .env
          echo "RCLONE_CONFIG_OFFSITE_TYPE=local" > backup.env
      - name: Build the image and start database, API, proxy and backups
        run: docker compose --profile gateway up --detach --build --wait
      - name: Check everything through the HTTPS proxy
        run: ./deploy/smoke-test.sh
      - name: Back up, then restore the encrypted copy and compare
        run: SMOKE_MERCHANT_KEY="$(cat ci-merchant-key)" BACKUP_TEST_KEY="$PWD/backup-key.txt" ./deploy/backup/test-backup.sh
      - name: Container logs
        if: failure()
        run: docker compose --profile gateway logs --no-color
      - name: Stop and remove the throwaway data
        if: always()
        run: docker compose --profile gateway down --volumes

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
