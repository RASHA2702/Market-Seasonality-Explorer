name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FiatCryptoGateway.sln
      # Warnings are errors (Directory.Build.props), so analyzer findings fail the build.
      - run: dotnet build FiatCryptoGateway.sln --no-restore --configuration Release
      - run: dotnet test FiatCryptoGateway.sln --no-build --configuration Release

  database:
    name: Migrations and constraint tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: gateway
          POSTGRES_USER: gateway_ci
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_ci -d gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: gateway
      PGUSER: gateway_ci
      PGPASSWORD: ci-only-throwaway
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: ./db/migrate.sh
      - name: Re-running migrations is a no-op
        run: |
          ./db/migrate.sh | tee migrate.log
          grep -q "Migrations applied: 0" migrate.log
      - name: Constraint tests
        run: |
          for test in db/tests/*.sql; do
            psql --no-psqlrc --quiet --set ON_ERROR_STOP=1 --file "$test"
          done

  container:
    name: Container image and HTTPS proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway settings for this run
        run: |
          umask 077
          printf 'POSTGRES_DB=gateway\nPOSTGRES_USER=gateway_app\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          {
            echo "Gateway__ApiKeys__Clients__0__ClientId=ci-merchant"
            echo "Gateway__ApiKeys__Clients__0__KeySha256=$(openssl rand -hex 32 | sha256sum | cut -d' ' -f1)"
            echo "Gateway__Checkout__LinkSecret=$(openssl rand -hex 32)"
          } > gateway.env
      - name: Build the image and start database, API and proxy
        run: docker compose --profile gateway up --detach --build --wait
      - name: Check everything through the HTTPS proxy
        run: ./deploy/smoke-test.sh
      - name: Container logs
        if: failure()
        run: docker compose --profile gateway logs --no-color
      - name: Stop and remove the throwaway data
        if: always()
        run: docker compose --profile gateway down --volumes

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
