# Local use; see the README.
#   docker compose up -d                               PostgreSQL only, for running the API with `dotnet run`.
#   docker compose --profile gateway up -d --build     also the API in a container, behind an HTTPS proxy (Caddy).
# Settings come from .env (copy .env.example) and gateway.env (copy gateway.env.example); never commit either.
# Published ports bind to 127.0.0.1 unless GATEWAY_BIND says otherwise.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (copy .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gateway_postgres:/var/lib/postgresql/data
      # First start only. For an existing volume, run db/migrate.sh (the API also applies new migrations at startup).
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [default, data]

  # The gateway API. Not published on the host: only the proxy can reach it.
  api:
    profiles: [gateway]
    build: .
    image: fiat-crypto-gateway-api:local
    env_file:
      - path: gateway.env
        required: true
    environment:
      Gateway__Storage__Provider: Postgres
      ConnectionStrings__Gateway: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Gateway__Checkout__BaseUrl: "https://${GATEWAY_DOMAIN:-localhost}"
      # Only the proxy may say which client a request came from.
      Gateway__Proxy__TrustedNetworks: "${GATEWAY_PROXY_ADDRESS:-172.30.10.2}/32"
      # Alerts (turned on in gateway.env) also watch the backup container's runs and link to the console.
      Gateway__Alerts__BackupMaxAgeHours: "26"
      Gateway__Alerts__ConsoleUrl: "https://${GATEWAY_DOMAIN:-localhost}/review"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # The HTTPS front door (deploy/Caddyfile).
  proxy:
    profiles: [gateway]
    image: caddy:2.10.2
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_HTTPS_PORT:-443}:443"
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_HTTPS_PORT:-443}:443/udp"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-localhost}
      GATEWAY_TLS: ${GATEWAY_TLS:-internal}
      GATEWAY_HSTS_SECONDS: ${GATEWAY_HSTS_SECONDS:-0}
      GATEWAY_REVIEW_FROM: ${GATEWAY_REVIEW_FROM:-private_ranges}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: ${GATEWAY_PROXY_ADDRESS:-172.30.10.2}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Encrypted database backups (deploy/backup): every night at BACKUP_AT, and once at start.
  backup:
    profiles: [gateway]
    build: deploy/backup
    image: fiat-crypto-gateway-backup:local
    init: true   # passes stop signals on, so a stop never waits out a sleeping schedule
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # The age public key(s) backups are encrypted to. The private key stays off this server.
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_TIME_ZONE: ${BACKUP_TIME_ZONE:-Asia/Kolkata}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_COPY_TO: ${BACKUP_COPY_TO:-}
      HOME: /tmp
    # Off-site storage credentials for rclone (RCLONE_CONFIG_...), if BACKUP_COPY_TO is set.
    env_file:
      - path: backup.env
        required: false
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [default, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "gateway-backup-health"]
      interval: 60s
      timeout: 10s
      start_period: 5m
      start_interval: 5s
    restart: unless-stopped

networks:
  # Proxy and API. The API reaches merchants' webhook endpoints from here.
  edge:
    ipam:
      config:
        - subnet: ${GATEWAY_EDGE_SUBNET:-172.30.10.0/24}
          # Addresses handed out automatically; the proxy's fixed address lies outside this range.
          ip_range: ${GATEWAY_EDGE_AUTO_RANGE:-172.30.10.128/25}
  # API and database only, with no way out.
  data:
    internal: true

volumes:
  gateway_postgres:
  caddy_data:     # the proxy's certificates and keys
  caddy_config:
